[project]
name = "python-cpp"
version = "0.2.0"
description = "Proof of concept: a Python package with a native C++23 core (nanobind + scikit-build-core)"
readme = "README.md"
authors = [
    { name = "Erik Ytterman", email = "erik.ytterman@phaseshift.se" }
]
requires-python = ">=3.13"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/python_cpp", "tests", "examples"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.scikit-build]
minimum-version = "build-system.requires"
# A persistent build dir keeps rebuilds incremental (a temporary one rebuilds everything)
build-dir = "build/{wheel_tag}"
# Optimized, with symbols so py-spy can name C++ frames (`just build` strips the wheel).
# -O3 like Rust's release profile (CMake's RelWithDebInfo default is -O2)
cmake.build-type = "RelWithDebInfo"
cmake.define.CMAKE_CXX_FLAGS_RELWITHDEBINFO = "-O3 -g -DNDEBUG"
install.strip = false
# Stable ABI wheel tag (cp313-abi3), matching STABLE_ABI in CMakeLists.txt
wheel.py-api = "cp313"
# The C++ tests are built by `just test`, not by the Python build
cmake.define.BUILD_TESTING = "OFF"

[tool.uv]
# Build in the project venv: an isolated build env gets a new path every time,
# which makes CMake reconfigure and rebuild from scratch on each C++ change
no-build-isolation-package = ["python-cpp"]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.{h,c,hpp,cpp}" }, { file = "CMakeLists.txt" }]

[build-system]
requires = ["scikit-build-core>=0.12", "nanobind>=3.1"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "auditwheel>=6.8.2",
    "clang-format>=23.1.3",
    "clang-tidy>=23.1.3",
    "cmake>=4.4.4",
    "mypy>=2.4.0",
    "nanobind>=3.1.0",
    "ninja>=1.13.2",
    "patchelf>=0.19.1.0",
    "py-spy>=0.4.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "rust-just>=1.59.0",
    "scikit-build-core>=1.1.1",
]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        python: ["3.13", "3.14", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The C++ compiler is the runner's own g++ (GCC 13 on 24.04, 15 on 26.04);
      # everything else comes from uv
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # Sets UV_PYTHON, which overrides .python-version
          python-version: ${{ matrix.python }}
      # Installs Python, the dev tools (including CMake, Ninja and just) and builds the extension
      - run: uv run just check
      - run: uv run just build
